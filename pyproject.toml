[project]
name = "ninjascript-rag"
version = "0.1.0"
description = "RAG system for NinjaScript documentation"
dependencies = [
    "scikit-learn>=1.3.0"
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]